<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c2a22">
<title>Goalkeeper Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1c2a22;
  --paper:rgba(250,250,246,.9);
  --paper-solid:#fafaf6;
  --ink:#16201b;
  --ink-soft:#56635b;
  --rule:rgba(22,32,27,.12);
  --signal:#ff7a1a;
  --signal-ink:#ffffff;
  --save:#1f9d55;
  --goal:#d63b2f;
  --mmw:150px;
  --cut:0px;
  --bot:max(12px,env(safe-area-inset-bottom,0px));
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  font-family:"Golos Text",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#121b16; --paper:rgba(246,246,240,.9); }
}
:root[data-theme="dark"]{ --bg:#121b16; --paper:rgba(246,246,240,.9); }
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html{height:100%}
html,body{margin:0;overscroll-behavior:none;touch-action:manipulation}
body{background:var(--bg);color:var(--ink);overflow:hidden;position:fixed;inset:0;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,label:focus-within{outline:2px solid var(--signal);outline-offset:2px}

.hud{position:absolute;top:max(10px,env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));
  display:flex;justify-content:space-between;align-items:center;gap:8px;pointer-events:none}
.hud .group{display:flex;gap:6px;align-items:center}
.chip{background:var(--paper);border-radius:8px;padding:6px 10px;font-size:13px;font-weight:600;line-height:1.1;
  box-shadow:0 1px 0 rgba(0,0,0,.08)}
.chip .n{font-variant-numeric:tabular-nums;font-weight:800}
.chip.saves .n{color:var(--save)}
.hbtn.off .w{display:none} .hbtn:not(.off) .x{display:none}
.hbtn{pointer-events:auto;background:var(--paper);border-radius:8px;width:32px;height:30px;display:grid;place-items:center;font-size:15px;font-weight:700}

.info{position:absolute;bottom:calc(var(--bot) + var(--cut));left:calc(var(--mmw) + 28px + env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right));
  margin:0 auto;pointer-events:none;background:var(--paper);border-radius:12px;padding:9px 14px;max-width:520px;
  transition:opacity .25s}
.info .main{font-size:15px;font-weight:700}
.info .main span{font-weight:500;color:var(--ink-soft);margin-left:8px}
.info .sub{font-size:12.5px;color:var(--ink-soft);margin-top:2px;line-height:1.35}
.info .cue{font-size:12px;font-weight:700;color:var(--signal);margin-top:3px}
.info.dim{opacity:.55}
.hidden{display:none!important}

.result{position:absolute;top:calc((100% - var(--cut)) / 2);transform:translateY(-50%);left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));
  margin-left:auto;margin-right:auto;max-width:600px;max-height:calc(100% - var(--cut) - 24px);overflow:auto;background:var(--paper-solid);border-radius:12px;padding:12px 12px 12px 16px;
  display:flex;align-items:center;gap:12px;box-shadow:0 10px 36px rgba(0,0,0,.35)}
@media (max-width:520px){ .result{flex-direction:column;align-items:stretch;padding:14px} .result .primary{width:100%} }
.result .txt{flex:1;min-width:0}
.result .title{font-size:20px;font-weight:800;letter-spacing:-.01em}
.result.ok .title{color:var(--save)} .result.bad .title{color:var(--goal)}
.result .why{font-size:13px;color:var(--ink);margin-top:1px}
.result .stats{font-size:12px;color:var(--ink-soft);margin-top:3px;font-variant-numeric:tabular-nums}
.primary{background:var(--signal);color:var(--signal-ink);font-weight:700;border-radius:10px;padding:12px 18px;font-size:15px;white-space:nowrap}
.primary.small{padding:10px 14px;font-size:14px}

.overlay{position:absolute;inset:0;bottom:var(--cut);display:flex;align-items:center;justify-content:center;padding:14px;
  background:rgba(14,22,17,.42);overflow:auto}
.card{background:var(--paper-solid);border-radius:16px;padding:22px 24px;width:min(560px,100%);margin:auto;box-shadow:0 18px 50px rgba(0,0,0,.3)}
.card h1{margin:0;font-size:30px;line-height:1.05;font-weight:800;letter-spacing:-.025em}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.head h1{min-width:0}
.langs{display:flex;gap:2px;flex:none;background:rgba(22,32,27,.06);border-radius:9px;padding:3px}
.langs button{padding:6px 9px;border-radius:7px;font-size:12.5px;font-weight:700;letter-spacing:.04em;color:var(--ink-soft)}
.langs button.on{background:var(--paper-solid);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.card h2{margin:0;font-size:24px;font-weight:800;letter-spacing:-.02em}
.lead{margin:8px 0 16px;color:var(--ink-soft);font-size:14.5px;line-height:1.45}
.lbl{font-size:13px;font-weight:700;margin:14px 0 6px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mode{text-align:left;border:1.5px solid var(--rule);border-radius:12px;padding:10px 12px}
.mode b{display:block;font-size:15px}
.mode small{display:block;font-size:12.5px;color:var(--ink-soft);margin-top:3px;line-height:1.35}
.mode.on{border-color:var(--signal);background:rgba(255,122,26,.07)}
.seg{display:flex;background:rgba(22,32,27,.06);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;padding:8px 6px;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--ink-soft)}
.seg button.on{background:var(--paper-solid);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.note{font-size:12px;color:var(--ink-soft);margin-top:6px;line-height:1.4}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:18px}
.ghost{border:1.5px solid var(--rule);border-radius:10px;padding:10px 14px;font-size:14px;font-weight:600;cursor:pointer}
.ghost input{display:none}
.best{font-size:13px;color:var(--ink-soft);margin-top:12px}
.credit{font-size:11.5px;color:var(--ink-soft);margin-top:8px;line-height:1.4}
#rReal{margin-top:2px}
.rotate{display:none;font-size:12.5px;color:var(--signal);font-weight:600;margin-top:10px}
@media (orientation:portrait){ .rotate{display:block} }
.sumgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 6px}
.stat{border:1.5px solid var(--rule);border-radius:12px;padding:10px}
.stat .v{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat .k{font-size:12px;color:var(--ink-soft);margin-top:2px}
.sumline{font-size:14px;line-height:1.45;margin-top:8px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;font-weight:600;margin-top:14px;cursor:pointer;line-height:1.35}
.check input{width:18px;height:18px;margin:1px 0 0;accent-color:var(--signal);flex:none}
.check small{display:block;font-weight:400;color:var(--ink-soft);font-size:12.5px;margin-top:2px}
.flash{position:absolute;top:calc((100% - var(--cut)) / 2);left:50%;transform:translate(-50%,-50%);pointer-events:none;background:var(--paper-solid);
  border-radius:12px;padding:8px 22px;font-size:22px;font-weight:800;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.flash.ok{color:var(--save)} .flash.bad{color:var(--goal)}
.card.wide{width:min(760px,100%)}
.logwrap{max-height:min(42vh,320px);overflow:auto;margin-top:12px;border:1.5px solid var(--rule);border-radius:12px}
table.log{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
table.log th{position:sticky;top:0;background:var(--paper-solid);text-align:left;font-weight:700;color:var(--ink-soft);padding:7px 8px;border-bottom:1.5px solid var(--rule)}
table.log td{padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
table.log tr:last-child td{border-bottom:0}
table.log td.res{font-weight:800;white-space:nowrap}
table.log td.res.ok{color:var(--save)} table.log td.res.bad{color:var(--goal)}
table.log td .who{color:var(--ink-soft);display:block;font-size:11.5px}
@media (max-height:430px){
  .card{padding:16px 18px} .card h1{font-size:24px} .lead{margin:6px 0 8px;font-size:13.5px}
  .lbl{margin:10px 0 5px}
}
@media (max-width:520px){ .modes{grid-template-columns:1fr} .sumgrid{grid-template-columns:1fr 1fr} }
/* экран «Поверни телефон»: только телефоны в вертикальном положении */
.rotlock{display:none;position:fixed;inset:0;z-index:50;background:var(--bg);color:#fafaf6;
  flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;
  padding:24px max(24px,env(safe-area-inset-right)) 24px max(24px,env(safe-area-inset-left))}
.rotlock h2{margin:8px 0 0;font-size:28px;font-weight:800;letter-spacing:-.02em;text-wrap:balance}
.rotlock p{margin:0;max-width:300px;font-size:15px;line-height:1.45;color:rgba(250,250,246,.72);text-wrap:balance}
.rotarrows{stroke:var(--signal)}
.rotphone rect{fill:rgba(250,250,246,.08);stroke:#fafaf6} .rotphone line{stroke:#fafaf6}
.rotphone{transform-box:view-box;transform-origin:80px 80px;animation:rotphone 2.6s ease-in-out infinite}
@keyframes rotphone{0%,18%{transform:rotate(0)} 48%,78%{transform:rotate(90deg)} 100%{transform:rotate(0)}}
@media (orientation:portrait) and (pointer:coarse) and (max-width:700px){ .rotlock{display:flex} }
@media (prefers-reduced-motion:reduce){ .info{transition:none} .rotphone{animation:none;transform:rotate(90deg)} }
</style>
</head>
<body>
<canvas id="cv" data-i18n-aria="canvasAria" aria-label="View from the goal"></canvas>

<div class="hud hidden" id="hud">
  <div class="group">
    <div class="chip" id="hMode">Open play</div>
  </div>
  <div class="group">
    <div class="chip"><span data-i18n="chipShot">Shot</span> <span class="n" id="hShot">1</span>/10</div>
    <div class="chip saves"><span data-i18n="chipSaves">Saves</span> <span class="n" id="hSaves">0</span></div>
    <button class="hbtn" id="hSound" data-i18n-aria="soundAria" aria-label="Sound" aria-pressed="true"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path class="w" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/><path class="x" d="M17 9l5 6M22 9l-5 6"/></svg></button>
    <button class="hbtn" id="hMenu" data-i18n-aria="menuAria" aria-label="Back to menu">✕</button>
  </div>
</div>

<div class="info hidden" id="info">
  <div class="main" id="iMain"></div>
  <div class="sub" id="iSub"></div>
  <div class="cue" id="iCue"></div>
</div>

<div class="result hidden" id="result">
  <div class="txt">
    <div class="title" id="rTitle"></div>
    <div class="why" id="rWhy"></div>
    <div class="stats" id="rStats"></div>
    <div class="stats" id="rReal"></div>
  </div>
  <button class="primary small" id="next">Next</button>
</div>

<div class="flash hidden" id="flash"></div>

<div class="rotlock" id="rotlock" role="alertdialog" aria-labelledby="rotTitle" aria-describedby="rotSub">
  <svg class="rotart" viewBox="0 0 160 160" width="170" height="170" aria-hidden="true">
    <g class="rotarrows" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M39 39 A58 58 0 0 1 121 39"/><path d="M117.4 25.6 L121 39 L107.6 35.4"/>
      <path d="M121 121 A58 58 0 0 1 39 121"/><path d="M52.4 124.6 L39 121 L42.6 134.4"/>
    </g>
    <g class="rotphone">
      <rect x="58" y="38" width="44" height="84" rx="9" stroke-width="4"/>
      <line x1="73" y1="47" x2="87" y2="47" stroke-width="3" stroke-linecap="round"/>
    </g>
  </svg>
  <h2 id="rotTitle" data-i18n="rotTitle">Rotate your phone</h2>
  <p id="rotSub" data-i18n="rotSub">The game is played with the phone held sideways.</p>
</div>

<div class="overlay" id="menu">
  <div class="card">
    <div class="head">
      <h1 data-i18n="h1">Goalkeeper Simulator</h1>
      <div class="langs" id="langs" role="group" aria-label="Language">
        <button data-lang="en" lang="en" aria-label="English">EN</button>
        <button data-lang="fr" lang="fr" aria-label="Français">FR</button>
        <button data-lang="ru" lang="ru" aria-label="Русский">RU</button>
      </div>
    </div>
    <p class="lead" data-i18n="lead"></p>

    <div class="lbl" data-i18n="lblMode"></div>
    <div class="modes" id="modes">
      <button class="mode on" data-mode="field"><b data-i18n="modeField"></b><small data-i18n="modeFieldNote"></small></button>
      <button class="mode" data-mode="penalty"><b data-i18n="modePen"></b><small data-i18n="modePenNote"></small></button>
    </div>

    <div class="lbl" data-i18n="lblSpeed"></div>
    <div class="seg" id="diffs">
      <button data-diff="easy" data-i18n="diffEasy"></button>
      <button data-diff="normal" class="on" data-i18n="diffNormal"></button>
      <button data-diff="real" data-i18n="diffReal"></button>
    </div>
    <div class="note" id="diffNote"></div>

    <label class="check"><input type="checkbox" id="analysis" checked><span><span data-i18n="analysis"></span><small data-i18n="analysisNote"></small></span></label>

    <div class="actions">
      <button class="primary" id="start" data-i18n="start"></button>
      <label class="ghost" tabindex="0"><span data-i18n="bg"></span><input type="file" accept="image/*" id="bgFile"></label>
      <button class="ghost hidden" id="bgReset" data-i18n="bgReset"></button>
    </div>
    <div class="best" id="best"></div>
    <div class="credit" data-i18n="credit"></div>
    <div class="rotate" data-i18n="rotate"></div>
  </div>
</div>

<div class="overlay hidden" id="summary">
  <div class="card wide">
    <h2 id="sTitle"></h2>
    <div class="sumgrid">
      <div class="stat"><div class="v" id="sSaves">0/10</div><div class="k" data-i18n="kSaves"></div></div>
      <div class="stat"><div class="v" id="sReact">–</div><div class="k" data-i18n="kReact"></div></div>
      <div class="stat"><div class="v" id="sStreak">0</div><div class="k" data-i18n="kStreak"></div></div>
    </div>
    <div class="sumline" id="sLine"></div>
    <div class="logwrap"><table class="log">
      <thead><tr><th data-i18n="thNo"></th><th data-i18n="thShot"></th><th data-i18n="thBall"></th><th data-i18n="thDive"></th><th data-i18n="thReact"></th><th data-i18n="thRes"></th></tr></thead>
      <tbody id="sLog"></tbody>
    </table></div>
    <div class="actions">
      <button class="primary" id="again" data-i18n="again"></button>
      <button class="ghost" id="toMenu" data-i18n="toMenu"></button>
    </div>
  </div>
</div>

const SFX = (() => {
  let ac = null, noise = null, master = null, on = true;
  try { on = localStorage.getItem('gk_sound') !== '0'; } catch (e) {}
  function unlock() {
    if (!on) return;
    try {
      if (!ac) {
        const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
        ac = new AC();
        master = ac.createGain(); master.gain.value = 0.8; master.connect(ac.destination);
        const len = ac.sampleRate * 2; noise = ac.createBuffer(1, len, ac.sampleRate);
        const d = noise.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      }
      if (ac.state !== 'running') {
        ac.resume();
        // iOS включает звук только после проигрывания чего-то внутри касания
        const b = ac.createBufferSource(); b.buffer = ac.createBuffer(1, 1, 22050); b.connect(ac.destination); b.start(0);
      }
    } catch (e) {}
  }
  function env(g, t, a, peak, d) {
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + a + d);
  }
  function tone(type, f0, f1, t, a, peak, d) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + a + d);
    env(g, t, a, peak, d); o.connect(g); g.connect(master); o.start(t); o.stop(t + a + d + 0.05);
  }
  function hiss(ftype, f0, f1, q, t, a, peak, d) {
    const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = noise; f.type = ftype; f.Q.value = q;
    f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + a + d);
    env(g, t, a, peak, d); s.connect(f); f.connect(g); g.connect(master);
    s.start(t, Math.random() * 0.4); s.stop(t + a + d + 0.05);
  }
  const ready = () => on && ac && ac.state === 'running';
  return {
    unlock,
    get on() { return on; },
    toggle() { on = !on; try { localStorage.setItem('gk_sound', on ? '1' : '0'); } catch (e) {} if (on) unlock(); return on; },
    kick() {            // удар по мячу: глухой «тук» + короткий шлепок

      if (!ready()) return; const t = ac.currentTime;

      hiss('bandpass', 900, 1200, 0.9, t + 0.12, 0.3, 0.1, 0.7);
    },
    goal() {            // мяч в сетке + рёв трибун
      if (!ready()) return; const t = ac.currentTime;

    }
  };

/* ---------- мир ---------- */
const GW = 7.32, GH = 2.44, HW = GW / 2;      // ворота, метры
const CAM = { y: 1.5, d: 4 };                 // камера: высота глаз и сколько метров за линией ворот
const BALL_R = 0.11, BALL_VIS = 1.8;          // мяч визуально увеличен, чтобы читался на телефоне
const SHOTS = 10;
const DIFF = {
  easy:   { k: 0.6, dive: 0 },
  normal: { k: 0.8, dive: 0.08 },
  real:   { k: 1,   dive: 0.16 }

const FREE = DATA.f.filter(r => r[4] === 0), OPEN = DATA.f.filter(r => r[4] === 1);
const pickOne = a => a[Math.floor(Math.random() * a.length)];

let W = 0, H = 0, DPR = 1, F = 1, HY = 0, CX = 0, MMW = 150;
let settings = { mode: 'field', diff: 'normal', analysis: true };
let lastShots = null;
let state = 'menu';
let shot = null, series = null;
let bgMid = null, userImg = null;

const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const num = (v, d = 2) => LANG === 'en' ? v.toFixed(d) : v.toFixed(d).replace('.', ',');
const pickW = w => { let r = Math.random() * w.reduce((a, b) => a + b, 0); for (let i = 0; i < w.length; i++) { r -= w[i]; if (r <= 0) return i; } return w.length - 1; };

function P(x, y, z) {
  const dz = Math.max(0.05, z + CAM.d);
  return { x: CX + F * x / dz, y: HY - F * (y - CAM.y) / dz, s: F / dz };
}

/* ---------- размеры ---------- */
let CUT = 0, BOT = 12, VH = 0, lastSize = '';
const probe = document.createElement('div');
probe.style.cssText = 'position:fixed;left:0;bottom:0;width:0;visibility:hidden;pointer-events:none;padding-bottom:env(safe-area-inset-bottom,0px)';
document.body.appendChild(probe);
function sizeKey() { const v = window.visualViewport; return [cv.clientWidth, cv.clientHeight, v ? Math.round(v.height) : 0, v ? Math.round(v.offsetTop) : 0].join('x'); }
function resize() {
  const r = cv.getBoundingClientRect();
  W = r.width; H = r.height;
  // Часть экрана может быть скрыта панелями браузера (Android, полноэкранный режим):
  // берём реально видимую высоту и поднимаем всё нижнее над скрытой полосой.
  const v = window.visualViewport;
  CUT = v ? Math.max(0, Math.round(r.bottom - (v.offsetTop + v.height))) : 0;
  if (CUT > H * 0.35) CUT = 0;                     // экранная клавиатура и т. п. — не считаем
  VH = H - CUT;
  BOT = Math.max(12, parseFloat(getComputedStyle(probe).paddingBottom) || 0) + CUT;
  document.documentElement.style.setProperty('--cut', CUT + 'px');
  lastSize = sizeKey();
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  F = Math.min(0.82 * W * CAM.d / GW, 0.52 * VH * CAM.d / GH);
  CX = W / 2;
  const gp = F * GH / CAM.d;
  const top = Math.max(VH * 0.15, (VH - gp) / 2 - VH * 0.04);
  HY = top + F * (GH - CAM.y) / CAM.d;
  MMW = Math.round(clamp(W * 0.16, 96, 160));
  document.documentElement.style.setProperty('--mmw', MMW + 'px');
  buildBg();
}

/* ---------- фон: рисуем поле и стадион, потом размываем через уменьшение ---------- */
function buildBg() {
  if (W < 2 || H < 2) return;
  const sw = Math.max(8, Math.round(W * 0.14)), sh = Math.max(8, Math.round(H * 0.14));
  const s = document.createElement('canvas'); s.width = sw; s.height = sh;
  const c = s.getContext('2d');
  c.setTransform(sw / W, 0, 0, sh / H, 0, 0);
  if (userImg) {
    const sc = Math.max(W / userImg.width, H / userImg.height);
    const iw = userImg.width * sc, ih = userImg.height * sc;
    c.drawImage(userImg, (W - iw) / 2, (H - ih) / 2, iw, ih);
  } else drawScene(c);
  const m = document.createElement('canvas');
  m.width = Math.max(8, Math.round(W * 0.42)); m.height = Math.max(8, Math.round(H * 0.42));
  const mc = m.getContext('2d');
  mc.imageSmoothingEnabled = true; mc.imageSmoothingQuality = 'high';
  mc.drawImage(s, 0, 0, m.width, m.height);
  bgMid = m;
}

function drawScene(c) {
  let seed = 11;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const roofY = HY - H * 0.30, standTop = HY - H * 0.25, boardY = HY - H * 0.022;

  let g = c.createLinearGradient(0, 0, 0, roofY + 4);
  g.addColorStop(0, '#86a9c2'); g.addColorStop(1, '#d6e1e7');
  c.fillStyle = g; c.fillRect(0, 0, W, roofY + 4);
  c.fillStyle = '#20282f'; c.fillRect(0, roofY, W, standTop - roofY + 2);
  g = c.createLinearGradient(0, standTop, 0, boardY);
  g.addColorStop(0, '#3c4651'); g.addColorStop(1, '#2c343c');
  c.fillStyle = g; c.fillRect(0, standTop, W, boardY - standTop + 1);
  const crowd = ['#c4483d', '#e9e3d8', '#3f6fb0', '#d9b33c', '#1c2227', '#8d9ca8', '#6b4d8a'];
  const n = Math.round(W * H * 0.0045);
  for (let i = 0; i < n; i++) {
    c.fillStyle = crowd[Math.floor(rnd() * crowd.length)];
    c.fillRect(rnd() * W, standTop + 3 + rnd() * (boardY - standTop - 6), 4, 4);
  }
  c.fillStyle = '#e8ebec'; c.fillRect(0, boardY, W, HY - boardY + 1);
  const ads = ['#2b5fa8', '#d84a33', '#1f8a5a', '#f0b52e'];
  for (let x = 0; x < W;) { const w = 60 + rnd() * 120; c.fillStyle = ads[Math.floor(rnd() * ads.length)]; c.fillRect(x, boardY + 2, w * 0.8, HY - boardY - 3); x += w; }

  c.fillStyle = '#3c7a33'; c.fillRect(0, HY, W, H - HY);
  for (let i = 0; i < 40; i++) {
    const z0 = -3.6 + i * 4.5, z1 = z0 + 4.5;
    const a = P(-90, 0, z0), b = P(90, 0, z0), cc = P(90, 0, z1), d = P(-90, 0, z1);
    c.fillStyle = i % 2 ? '#428638' : '#3a7a31';
    c.beginPath(); c.moveTo(a.x, a.y); c.lineTo(b.x, b.y); c.lineTo(cc.x, cc.y); c.lineTo(d.x, d.y); c.closePath(); c.fill();
  }
  c.strokeStyle = 'rgba(255,255,255,.85)'; c.lineCap = 'round';
  const L = (pts, zw) => {
    c.lineWidth = Math.max(1, 0.12 * F / (zw + CAM.d));
    c.beginPath();
    pts.forEach((p, i) => { const q = P(p[0], 0, p[1]); i ? c.lineTo(q.x, q.y) : c.moveTo(q.x, q.y); });
    c.stroke();
  };
  L([[-60, 0], [60, 0]], 0);
  L([[-9.16, 0], [-9.16, 5.5], [9.16, 5.5], [9.16, 0]], 3);
  L([[-20.16, 0], [-20.16, 16.5], [20.16, 16.5], [20.16, 0]], 9);
  const arc = []; for (let a = -0.92; a <= 0.921; a += 0.08) arc.push([9.15 * Math.sin(a), 11 + 9.15 * Math.cos(a)]);
  L(arc, 18);
  L([[-34, 0], [-34, 52.5]], 20); L([[34, 0], [34, 52.5]], 20);
  L([[-34, 52.5], [34, 52.5]], 52);
  const sp = P(0, 0, 11);
  c.fillStyle = '#fff'; c.beginPath(); c.ellipse(sp.x, sp.y, Math.max(1.5, 0.2 * sp.s), Math.max(1, 0.06 * sp.s), 0, 0, 7); c.fill();
}

/* ---------- ворота ---------- */
function rr(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function grid(a, b, c2, d, nu, nv) {
  const L = (p, q, t) => ({ x: p.x + (q.x - p.x) * t, y: p.y + (q.y - p.y) * t });
  ctx.beginPath();
  for (let i = 0; i <= nu; i++) { const t = i / nu, p = L(a, b, t), q = L(c2, d, t); ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y); }
  for (let j = 1; j <= nv; j++) { const t = Math.pow(j / nv, 1.5), p = L(a, c2, t), q = L(b, d, t); ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y); }
  ctx.stroke();
}
function drawNets() {
  const tl = P(-HW - .06, GH + .06, 0), tr = P(HW + .06, GH + .06, 0), bl = P(-HW - .06, 0, 0), br = P(HW + .06, 0, 0);
  ctx.save();
  ctx.fillStyle = 'rgba(20,28,24,.10)';
  ctx.beginPath(); ctx.moveTo(-6, -6); ctx.lineTo(W + 6, -6); ctx.lineTo(tr.x, tr.y); ctx.lineTo(tl.x, tl.y); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.30)'; ctx.lineWidth = 1;
  grid(tl, tr, { x: -W * 0.06, y: -6 }, { x: W * 1.06, y: -6 }, 20, 5);
  grid(tl, bl, { x: -6, y: -H * 0.03 }, { x: -6, y: H * 1.06 }, 7, 5);
  grid(tr, br, { x: W + 6, y: -H * 0.03 }, { x: W + 6, y: H * 1.06 }, 7, 5);
  ctx.restore();
}
function drawFrame() {
  const t = 0.12;
  const R = (x0, y0, x1, y1) => { const a = P(x0, y1, 0), b = P(x1, y0, 0); return [a.x, a.y, b.x - a.x, b.y - a.y]; };
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,.35)'; ctx.shadowBlur = 12; ctx.shadowOffsetY = 2;
  ctx.fillStyle = '#f8f8f4';
  ctx.fillRect(...R(-HW - t, 0, -HW, GH + t));
  ctx.fillRect(...R(HW, 0, HW + t, GH + t));
  ctx.fillRect(...R(-HW - t, GH, HW + t, GH + t));
  ctx.restore();
  ctx.fillStyle = 'rgba(0,0,0,.08)';
  ctx.fillRect(...R(-HW - 0.03, 0, -HW, GH));
  ctx.fillRect(...R(HW, 0, HW + 0.03, GH));
  ctx.fillRect(...R(-HW, GH, HW, GH + 0.03));
}

/* ---------- зоны ---------- */
function zoneRect(i) {
  const c = i % 3, r = Math.floor(i / 3), x0 = -HW + c * GW / 3;
  return { x0, x1: x0 + GW / 3, y1: GH - r * GH / 2, y0: GH - (r + 1) * GH / 2 };

  const col = x < b.c1 ? 0 : x < b.c2 ? 1 : 2, row = y < b.mid ? 0 : 1;
  return row * 3 + col;
}
function handleTap(cx, cy, t) {
  if (state !== 'flight' || shot.pick !== null) return;
  const r = cv.getBoundingClientRect(), x = cx - r.left, y = cy - r.top;
  taps.push({ x, y, t: now });
  tapZone(zoneAt(x, y), t);
}
if (window.PointerEvent) {
  cv.addEventListener('pointerdown', e => { e.preventDefault(); handleTap(e.clientX, e.clientY, performance.now() / 1000); });
  // блокируем прокрутку, двойной тап-зум и выделение на iOS; pointer-события при этом продолжают приходить
  cv.addEventListener('touchstart', e => e.preventDefault(), { passive: false });
  cv.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
} else {
  cv.addEventListener('touchstart', e => { e.preventDefault(); const t = e.changedTouches[0]; handleTap(t.clientX, t.clientY, performance.now() / 1000); }, { passive: false });
  cv.addEventListener('mousedown', e => handleTap(e.clientX, e.clientY, performance.now() / 1000));
}
document.addEventListener('gesturestart', e => e.preventDefault());   // pinch-зум в Safari
function goFullscreen() {
  if (!IS_TOUCH || document.fullscreenElement || document.webkitFullscreenElement) return;
  const el = document.documentElement;
  try {
    const p = el.requestFullscreen ? el.requestFullscreen({ navigationUI: 'hide' }) : el.webkitRequestFullscreen && el.webkitRequestFullscreen();
    if (p && p.catch) p.catch(() => {});
  } catch (e) {}
}
document.addEventListener('fullscreenchange', () => { setTimeout(resize, 100); setTimeout(resize, 500); });
if (window.visualViewport) visualViewport.addEventListener('resize', resize);
cv.addEventListener('contextmenu', e => e.preventDefault());
const CODES = { KeyQ: 0, KeyW: 1, KeyE: 2, KeyA: 3, KeyS: 4, KeyD: 5 };
const KEYS = { q: 0, w: 1, e: 2, a: 3, s: 4, d: 5, 'й': 0, 'ц': 1, 'у': 2, 'ф': 3, 'ы': 4, 'в': 5 };
window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (e.code in CODES) { tapZone(CODES[e.code]); return; }
  if (k in KEYS) { tapZone(KEYS[k]); return; }
  if ((k === ' ' || k === 'enter') && state === 'result') { e.preventDefault(); $('next').click(); }
});
$('next').addEventListener('click', () => { if (state !== 'result') return; series.i >= SHOTS ? endSeries() : nextShot(); });
$('hMenu').addEventListener('click', toMenu);
['pointerdown', 'touchend', 'click', 'keydown'].forEach(ev => document.addEventListener(ev, () => SFX.unlock(), true));
function syncSound() { $('hSound').classList.toggle('off', !SFX.on); $('hSound').setAttribute('aria-pressed', SFX.on ? 'true' : 'false'); }
$('hSound').addEventListener('click', () => { SFX.toggle(); syncSound(); });
syncSound();
$('again').addEventListener('click', () => { goFullscreen(); startSeries(true); });
$('toMenu').addEventListener('click', toMenu);
$('start').addEventListener('click', () => { goFullscreen(); startSeries(false); });
document.querySelectorAll('#modes .mode').forEach(b => b.addEventListener('click', () => {
  settings.mode = b.dataset.mode;
  document.querySelectorAll('#modes .mode').forEach(x => x.classList.toggle('on', x === b));
  updateMenu();
}));
document.querySelectorAll('#diffs button').forEach(b => b.addEventListener('click', () => {
  settings.diff = b.dataset.diff;
  document.querySelectorAll('#diffs button').forEach(x => x.classList.toggle('on', x === b));
  updateMenu();
}));
$('analysis').addEventListener('change', e => { settings.analysis = e.target.checked; try { localStorage.setItem('gk_analysis', e.target.checked ? '1' : '0'); } catch (err) {} });
$('bgFile').addEventListener('change', e => {
  const f = e.target.files && e.target.files[0]; if (!f) return;
  const url = URL.createObjectURL(f), img = new Image();
  img.onload = () => { userImg = img; buildBg(); $('bgReset').classList.remove('hidden'); };
  img.src = url;
});
$('bgReset').addEventListener('click', () => { userImg = null; buildBg(); $('bgReset').classList.add('hidden'); $('bgFile').value = ''; });

function updateMenu() {
  $('diffNote').textContent = t('note_' + settings.diff);
  let best = 0;
  try { best = parseInt(localStorage.getItem(`gk_best_${settings.mode}_${settings.diff}`) || '0', 10) || 0; } catch (e) {}
  $('best').textContent = best ? t('best', best) : (IS_TOUCH ? t('hintTouch') : t('hintMouse'));
}
function applyLang(l) {
  if (l && I18N[l]) { LANG = l; try { localStorage.setItem('gk_lang', l); } catch (e) {} }
  document.documentElement.lang = LANG;
  document.title = t('title');
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-aria]').forEach(el => el.setAttribute('aria-label', t(el.dataset.i18nAria)));
  document.querySelectorAll('#langs button').forEach(b => {
    const on = b.dataset.lang === LANG; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on ? 'true' : 'false');
  });
  updateMenu();
}
document.querySelectorAll('#langs button').forEach(b => b.addEventListener('click', () => applyLang(b.dataset.lang)));

window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 200));
try { const a = localStorage.getItem('gk_analysis'); if (a !== null) { settings.analysis = a === '1'; $('analysis').checked = settings.analysis; } } catch (e) {}
resize(); applyLang();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
